services:
  - type: web
    name: healthecho-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HEALTHECHO_ALLOW_ORIGINS
        value: "*"

  - type: static
    name: healthecho-frontend
    buildCommand: ""
    publishPath: .
